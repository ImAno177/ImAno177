    <tspan x="390" y="470" class="cc">. </tspan><tspan class="key">Repos</tspan>:<tspan class="cc"> ............................... </tspan><tspan class="value">[AUTO]</tspan>
    <tspan x="390" y="490" class="cc">. </tspan><tspan class="key">Followers</tspan>:<tspan class="cc"> ........................ </tspan><tspan class="value">[AUTO]</tspan>
