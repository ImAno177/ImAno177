<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="985px" height="530px" font-size="16px" viewBox="0 0 985 530" role="img" aria-labelledby="title desc">
  <title id="title">ImAno177 terminal profile</title>
  <desc id="desc">A terminal-style GitHub profile for ImAno177 with contact routes, portfolio and placeholder profile fields.</desc>
  <style>
    @font-face {
      src: local('Consolas'), local('Consolas Bold');
      font-family: 'ConsolasFallback';
      font-display: swap;
      -webkit-size-adjust: 109%;
      size-adjust: 109%;
    }
    .key { fill: #953800; }
    .value { fill: #0550ae; }
    .accent { fill: #1a7f37; }
    .cc { fill: #6e7781; }
    text, tspan { white-space: pre; }
  </style>

  <rect width="985px" height="530px" fill="#f6f8fa" rx="15" />
